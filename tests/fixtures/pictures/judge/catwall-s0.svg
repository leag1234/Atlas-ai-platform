      <rect x="3" y="4" width="50" height="22" rx="3" fill="#b95f43"/>
      <rect x="59" y="4" width="50" height="22" rx="3" fill="#c46a4b"/>
      <rect x="-25" y="32" width="50" height="22" rx="3" fill="#ad563e"/>
