# Owner installs this template under .github/workflows after review.
name: Publish container images
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: runtime, file: infra/docker/Dockerfile}
          - {name: webui, file: infra/docker/Dockerfile.webui}
          - {name: frontend, file: infra/docker/Dockerfile.frontend}
          - {name: postgres, file: infra/docker/Dockerfile.postgres}
          - {name: searxng, file: infra/docker/Dockerfile.searxng}
          - {name: ollama, file: infra/docker/Dockerfile.ollama}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
