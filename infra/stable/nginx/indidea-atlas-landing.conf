# Include this location in the existing indidea.org server block.
# It deliberately does not proxy: Atlas lives on its own sub-domain.
location = /atlas {
    return 301 /atlas/;
}

location = /atlas/ {
    alias /var/www/indidea/atlas/landing.html;
    default_type text/html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
