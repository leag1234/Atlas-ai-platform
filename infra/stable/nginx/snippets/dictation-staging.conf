# Prepared, not applied. Insert into /etc/nginx/sites-available/atlas-staging, in the HTTPS server block, just before
# "# Open WebUI v0.11.3 mounts Socket.IO here." (location ^~ /ws/). Then the operator validates and reloads nginx.
    # Real-time dictation (ATLAS_REALTIME_DICTATION): the voice button's WebSocket, relayed
    # by the UI relay to the Atlas adapter. Sessions last 300 s at most.
    location = /api/atlas/dictation/stream {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Atlas-User "$remote_user@atlas.indidea.org";
        include /etc/nginx/atlas-staging-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; the relay checks the Open WebUI session cookie.
        proxy_set_header Authorization "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering off;
    }
