# Local harness-only equivalent of atlas.indidea.org.conf.
# Test runner uses base 1900 and a loopback tunnel stand-in at port 4910.
limit_req_zone $binary_remote_addr zone=atlas_test_chat:10m rate=12r/m;

server {
    listen 127.0.0.1:8900;
    server_name atlas.test;
    root /usr/share/nginx/html;
    client_max_body_size 64m;
    auth_basic "Atlas local test";
    auth_basic_user_file /etc/nginx/atlas.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    error_page 502 504 /maintenance.html;

    location = /maintenance.html { internal; try_files /maintenance.html =503; }
    location ^~ /static-atlas/ { alias /usr/share/nginx/html/static-atlas/; try_files $uri =404; }
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:4910;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Atlas-User "$remote_user@atlas.test";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; Open WebUI uses its session cookie.
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Stop button: cancels the running answer in the Atlas adapter (unguessable request id).
    location ^~ /atlas/cancel/ {
        limit_req zone=atlas_test_chat burst=8 nodelay;
        proxy_pass http://127.0.0.1:9920;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
    }

    location ~ ^/api/(chat/completions|v1/chat/completions)$ {
        limit_req zone=atlas_test_chat burst=8 nodelay;
        proxy_pass http://127.0.0.1:4910;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Atlas-User "$remote_user@atlas.test";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; Open WebUI uses its session cookie.
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:4910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Atlas-User "$remote_user@atlas.test";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; Open WebUI uses its session cookie.
        proxy_set_header Authorization "";
        proxy_buffering off;
    }
}
