# /etc/nginx/sites-enabled/atlas.indidea.org
# Open WebUI is reachable only through the local SSH tunnel at 127.0.0.1:3100.
# Replace the certificate placeholders after obtaining the certificate below:
# certbot --nginx -d atlas.indidea.org

limit_req_zone $binary_remote_addr zone=atlas_chat:10m rate=12r/m;

# Open WebUI API keys (owner decision 2026-10-27): a Bearer sk- request skips basic
# auth on the key routes only and keeps its Authorization header; every other request
# still loses its basic credentials here.
map $http_authorization $atlas_key_realm {
    "~^Bearer sk-" off;
    default "Atlas";
}
map $http_authorization $atlas_upstream_authorization {
    "~^Bearer (sk-[A-Za-z0-9_-]+)$" "Bearer $1";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name atlas.indidea.org;

    location /.well-known/acme-challenge/ {
        root /var/www/indidea/atlas;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlas.indidea.org;

    # Placeholders: certbot writes the real paths for atlas.indidea.org.
    ssl_certificate /etc/letsencrypt/live/atlas.indidea.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.indidea.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/indidea/atlas;
    client_max_body_size 64m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    auth_basic "Atlas";
    auth_basic_user_file /etc/nginx/atlas.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    error_page 502 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        auth_basic off;
        try_files /maintenance.html =503;
    }

    # Locally managed static Atlas material never crosses the SSH tunnel.
    location ^~ /static-atlas/ {
        alias /var/www/indidea/atlas/static-atlas/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # Open WebUI v0.11.3 mounts Socket.IO here.
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Atlas-User "$remote_user@atlas.indidea.org";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; Open WebUI uses its session cookie.
        proxy_set_header Authorization "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Chat answers are streamed as SSE; limit bursts without buffering them.
    # Stop button: cancels the running answer in the Atlas adapter (unguessable request id).
    location ^~ /atlas/cancel/ {
        limit_req zone=atlas_chat burst=8 nodelay;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Atlas-User "$remote_user@atlas.indidea.org";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        proxy_set_header Authorization "";
    }

    # Atlas keys terminate at the adapter; never assert a browser identity here.
    location ^~ /api/atlas/v1/ {
        auth_basic off;
        # Normalize header-only clients before the existing credential syntax gate.
        if ($http_authorization = "") { set $http_authorization "Bearer $http_x_api_key"; }
        if ($http_authorization !~ "^Bearer atl_[A-Za-z0-9_-]+$") { return 401; }
        limit_req zone=atlas_chat burst=8 nodelay;
        limit_req_status 429;
        error_page 429 = @atlas_key_rate_limited;
        error_page 401 = @atlas_key_unauthorized;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Atlas-User "";
        proxy_set_header X-Atlas-User-Role "";
        proxy_set_header X-Atlas-Proxy-Secret "";
        proxy_set_header X-OpenWebUI-User-Id "";
        proxy_set_header X-OpenWebUI-User-Email "";
        proxy_set_header X-Atlas-Project-Identity "";
        proxy_set_header X-Atlas-Identity-Secret "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @atlas_key_unauthorized {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header WWW-Authenticate Bearer always;
        if ($uri ~ "^/api/atlas/v1/(v1/)?messages(/count_tokens)?/?$") {
            return 401 '{"type":"error","error":{"type":"authentication_error","message":"Invalid API key"}}';
        }
        return 401 '{"error":{"type":"authentication_error","message":"Invalid API key"}}';
    }

    location @atlas_key_rate_limited {
        default_type application/json;
        add_header Cache-Control no-store always;
        if ($uri ~ "^/api/atlas/v1/(v1/)?messages(/count_tokens)?/?$") {
            return 429 '{"type":"error","error":{"type":"rate_limit_error","message":"Request rate limit exceeded"}}';
        }
        return 429 '{"error":{"type":"rate_limit_error","message":"Request rate limit exceeded"}}';
    }

    location ~ ^/api/(chat/completions|v1/chat/completions|models)$ {
        auth_basic $atlas_key_realm;
        limit_req zone=atlas_chat burst=8 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Atlas-User "$remote_user@atlas.indidea.org";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; Open WebUI uses its session cookie.
        proxy_set_header Authorization $atlas_upstream_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Generated images and SVG drawings are served by the Atlas adapter, never by Open WebUI.
    location ^~ /images/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Atlas-User "$remote_user@atlas.indidea.org";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header Authorization "";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The upstream accepts this only from the tunnel; never expose port 3100.
        proxy_set_header X-Atlas-User "$remote_user@atlas.indidea.org";
        include /etc/nginx/atlas-proxy-secret.conf;
        proxy_set_header X-Atlas-User-Role user;
        proxy_set_header X-OpenWebUI-User-Role "";
        proxy_set_header X-Forwarded-Role "";
        # Basic credentials terminate here; Open WebUI uses its session cookie.
        proxy_set_header Authorization "";
        proxy_buffering off;
    }
}
