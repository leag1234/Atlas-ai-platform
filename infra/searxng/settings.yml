# SearXNG settings owned by ATLAS.  server.secret_key is overridden by
# SEARXNG_SECRET at runtime; no credential is committed here.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - wikipedia
      - qwant
      - startpage
      - bing
      - google

general:
  enable_metrics: false

search:
  safe_search: 1
  default_lang: en
  autocomplete: ""
  ban_time_on_fail: 60
  max_ban_time_on_fail: 3600
  # Short sidecar cooldowns; the client owns the three-block quarantine.
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 60
    SearxEngineTooManyRequests: 60
    cf_SearxEngineCaptcha: 60
    cf_SearxEngineAccessDenied: 60
    recaptcha_SearxEngineCaptcha: 60
  formats:
    - html
    - json

server:
  secret_key: ultrasecretkey
  limiter: false
  image_proxy: false
  public_instance: false

# The client queries one web engine at a time; Wikipedia runs in parallel.
# Ecosia is absent from the pinned 2026.10.17 engine registry.
engines:
  - name: wikipedia
    display_type: [list]
  - name: qwant
    disabled: false
  - name: bing
    disabled: false
  - name: startpage
    # The pinned engine declares Startpage inactive: it requires an Anubis
    # proof-of-work CAPTCHA and returned no usable results in the local matrix.
    disabled: true

outgoing:
  request_timeout: 7.0
  max_request_timeout: 8.0
  retries: 0
