server {
    listen 8080;
    client_max_body_size 32m;
    proxy_read_timeout 310s;
    proxy_buffering off;
    location /healthz { return 200 'ready'; add_header Content-Type text/plain; }
    location = /api/v1/files/ {
        set $args "process=false&process_in_background=false";
        proxy_pass http://webui:13730;
        proxy_set_header Host $host;
    }
    location ~ ^/(images|sources)/ {
        proxy_pass http://orchestrator:13720;
        proxy_set_header Host $host;
    }
    location /atlas/cancel/ {
        proxy_pass http://orchestrator:13720;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://webui:13730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
