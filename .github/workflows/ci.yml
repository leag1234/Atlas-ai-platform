# CI — fait autorité sur l'état des jalons. NE PAS éditer par l'agent (CODEOWNERS).
name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only changes documentation does not need the full test gate. This job decides.
  # Fail-safe: anything unclear (a push, no changed file, a file outside docs/, a docs file that a test,
  # a script or the code refers to) runs the full gate exactly as before.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [[ "$EVENT" == "pull_request" ]]; then
            files="$(git diff --no-renames --name-only "$BASE...$HEAD")"
            echo "Changed files:"; echo "$files"
            if [[ -n "$files" ]]; then
              docs_only=true
              while IFS= read -r file; do
                case "$file" in
                  docs/*)
                    if grep -rqF -- "$file" tests scripts Makefile services packages contracts prompts 2>/dev/null; then
                      echo "$file is referenced by checks or code: full gate"
                      docs_only=false; break
                    fi ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  # The checks that apply to documentation only.
  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Documentation is in English
        run: bash scripts/verify-m16.sh
      - name: Secret scan
        run: make scan-secrets

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The test gate is split into parallel shards; the workflow (and the check
    # that automerge waits for) succeeds only when every shard succeeds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: unit, milestones: "" }
          - { shard: milestones, milestones: "5-6,7-12" }
          - { shard: milestones, milestones: "13-19" }
          - { shard: milestones, milestones: "20-26" }
    name: tests (${{ matrix.shard }} ${{ matrix.milestones }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: deps-${{ hashFiles('**/requirements*.txt','**/package-lock.json') }}

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          [[ -f requirements-dev.txt ]] && pip install -q -r requirements-dev.txt || true

      - name: Lint
        if: matrix.shard == 'unit'
        run: make lint

      - name: Typecheck
        if: matrix.shard == 'unit'
        run: make typecheck

      - name: Tests (no live LLM)
        env:
          ATLAS_CI_SHARD: ${{ matrix.shard }}
          ATLAS_CI_MILESTONES: ${{ matrix.milestones }}
        run: make test

      - name: Secret scan
        if: matrix.shard == 'unit'
        run: make scan-secrets

      - name: No hardcoded model names outside model-gateway
        if: matrix.shard == 'unit'
        run: |
          if grep -rniE 'qwen|glm|deepseek|llama|mistral|kimi' \
               --include='*.py' --include='*.ts' --include='*.js' --include='*.go' \
               --exclude-dir=services/model-gateway --exclude-dir=node_modules \
               services/ 2>/dev/null; then
            echo "::error::nom de modèle en dur hors model-gateway (docs/02 AC-ARC-4)"
            exit 1
          fi

      - name: No OpenAI/Anthropic as a runtime dependency of the PoC
        if: matrix.shard == 'unit'
        run: |
          # Codex (OpenAI) construit le PoC mais ne doit JAMAIS être appelé par le
          # produit : l'inférence reste 100% Scaleway/open-weight. On interdit donc
          # tout import/usage d'un SDK de fournisseur US dans le code des services.
          if grep -rniE "import openai|from openai|require\(.openai|openai\.|anthropic" \
               --include='*.py' --include='*.ts' --include='*.js' --include='*.go' \
               --exclude-dir=node_modules services/ 2>/dev/null; then
            echo "::error::dépendance d'exécution vers OpenAI/Anthropic détectée — interdit (docs/07, docs/14)"
            exit 1
          fi
          # Et pas dans les manifests de dépendances runtime non plus.
          if grep -rniE '^\s*"?(openai|anthropic)"?\s*[:=]' \
               requirements*.txt package.json pyproject.toml 2>/dev/null \
               | grep -viE 'dev|test'; then
            echo "::error::openai/anthropic listé comme dépendance runtime — déplacer en dev ou retirer"
            exit 1
          fi

      - name: Eval smoke
        if: matrix.shard == 'unit'
        env:
          SCW_GENERATIVE_API_KEY: ${{ secrets.SCW_GENERATIVE_API_KEY }}
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
        run: make eval-smoke

  # Single required check "ci" (branch ruleset and automerge): green only when the changes job
  # succeeded and either the documentation checks (documentation-only change) or every test shard passed.
  ci:
    needs: [changes, tests, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Required checks passed
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          DOCS: ${{ needs.docs.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          test "$CHANGES" = success
          if [[ "$DOCS_ONLY" == "true" ]]; then
            test "$DOCS" = success && test "$TESTS" = skipped
          else
            test "$TESTS" = success && test "$DOCS" = skipped
          fi
