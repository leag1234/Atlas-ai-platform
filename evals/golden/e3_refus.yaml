# E3 — Refus honnête : questions PLAUSIBLES mais dont la réponse N'EST PAS dans le corpus.
# Le système doit dire qu'il ne trouve pas l'information, PAS inventer.
# Vérification : déterministe (le système signale l'absence) + juge (zéro invention de fait).
# Chaque question est crédible dans le domaine, mais l'info n'existe dans aucun document.

- id: E3-01
  lang: fr
  input: "Quel est le nombre de jours de congés payés annuels chez NORDIA ?"
  attendu: "Signale que la politique de télétravail ne traite pas des congés payés. Aucun chiffre inventé."
  note: "le doc RH parle de télétravail, pas de congés"

- id: E3-02
  lang: de
  input: "Wie hoch ist der Stundensatz für Wochenendarbeit im Dienstleistungsvertrag?"
  attendu: "Indique que le contrat ne mentionne pas de tarif week-end (seulement 1200€/jour). Pas d'invention."
  note: "le contrat DE n'a pas de tarif week-end"

- id: E3-03
  lang: en
  input: "What was HELIOS's net profit in Q3 2026?"
  attendu: "Dit que le rapport donne le CA, la marge et la trésorerie, mais pas le bénéfice net. N'invente aucun chiffre."
  note: "le rapport ne donne pas le net profit"

- id: E3-04
  lang: es
  input: "¿Qué versión de PostgreSQL se usa en producción?"
  attendu: "Indica que el runbook no especifica la versión de PostgreSQL. No inventa un número de versión."
  note: "le runbook ne donne pas la version"

