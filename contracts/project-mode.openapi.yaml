components:
  securitySchemes:
    ExecutionBroker:
      type: apiKey
      in: header
      name: X-Atlas-Execution-Secret
      description: Private service credential; audience header must be atlas-retrieval-execution.
    ScopedProjectIdentity:
      type: apiKey
      in: header
      name: X-Atlas-Project-Identity
      description: Fresh retrieval-issued scoped identity with audience atlas-retrieval-projects;
        insufficient without ExecutionBroker.
    IdentityBroker:
      type: apiKey
      in: header
      name: X-Atlas-Identity-Secret
      description: Private orchestrator-to-retrieval credential from ATLAS_PROJECT_IDENTITY_SECRET;
        never logged or accepted at the public BFF.
    SessionCookie:
      type: apiKey
      in: cookie
      name: token
      description: Existing host session, verified server-side at BFF, never decoded without verification. Same-origin
        and CSRF checks required for mutations.
    TrustedUser:
      type: apiKey
      in: header
      name: X-Atlas-User
      description: Private ingress only, stripped from browser traffic; never an organization role.
    TrustedProxy:
      type: apiKey
      in: header
      name: X-Atlas-Proxy-Secret
      description: Paired with TrustedUser only on authenticated restricted proxy ingress; stripped at relay. Never
        sent to workers.
    InternalIdentity:
      type: http
      scheme: bearer
      bearerFormat: signed scoped identity
      description: 'Internal only: short-lived audience-bound subject, org, project, membership/policy revisions
        and expiry; not a public auth alternative.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Scoped to member, org, method and canonical path; same body replays the original result for at
        least 24 hours.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: Quoted decimal resource revision; stale -> 409; absent -> 428. Grant creation uses "0" for absence.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ApprovalId:
      name: approval_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: Single-use broker approval bound to exact deletion/version scope.
  schemas:
    TranscriptMemory:
      type: object
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        generation:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        arguments:
          additionalProperties: false
          properties:
            operation:
              enum:
              - read
              - search
              - propose
              - correct
              type: string
            id:
              anyOf:
              - format: uuid
                type: string
              - type: 'null'
              default: null
            query:
              anyOf:
              - maxLength: 2000
                minLength: 1
                type: string
              - type: 'null'
              default: null
            text:
              anyOf:
              - maxLength: 500
                minLength: 1
                type: string
                pattern: \S
              - type: 'null'
              default: null
            kind:
              default: fact
              enum:
              - constraint
              - decision
              - fact
              - preference
              - open_question
              - summary
              type: string
          required:
          - operation
          type: object
      required:
      - conversation_id
      - request_id
      - generation
      - arguments
    TranscriptBegin:
      type: object
      additionalProperties: false
      properties:
        request_id: &transcript_id001
          type: string
          format: uuid
        request:
          $ref: '#/components/schemas/ProjectChatRequest'
      required:
      - request_id
      - request
    TranscriptState:
      type: object
      additionalProperties: false
      properties:
        turn:
          $ref: '#/components/schemas/Turn'
        context:
          $ref: '#/components/schemas/Context'
        replay:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEvent'
          maxItems: 100
        last_event_seq:
          type: integer
          minimum: 0
      required:
      - turn
      - context
      - replay
      - events
      - last_event_seq
    TranscriptFinish:
      type: object
      additionalProperties: false
      properties:
        request_id: *transcript_id001
        conversation_id: *transcript_id001
        state:
          type: string
          enum:
          - completed
          - failed
          - cancelled
        content_refs:
          type: array
          items:
            $ref: '#/components/schemas/ContentRef'
        usage:
          $ref: '#/components/schemas/Usage'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - request_id
      - conversation_id
      - state
      - content_refs
      - usage
      - error
    TranscriptEvents:
      type: object
      additionalProperties: false
      properties:
        conversation_id: *transcript_id001
        request_id: *transcript_id001
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEvent'
          minItems: 1
          maxItems: 40
      required:
      - conversation_id
      - request_id
      - events
    TranscriptEventsResult:
      type: object
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEvent'
          minItems: 1
          maxItems: 40
      required:
      - events
    OrganizationOperation:
      type: object
      additionalProperties: false
      properties:
        file_id: &organize001
          type: string
          format: uuid
        base_version: *organize001
        expected_revision:
          type: integer
          minimum: 0
        folder_id: *organize001
        path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)[^\x00]+$
      required:
      - file_id
      - base_version
      - expected_revision
      - folder_id
      - path
    ExecutionOrganize:
      type: object
      additionalProperties: false
      properties:
        session_id: *organize001
        request_id: *organize001
        generation:
          type: integer
          minimum: 1
        mode:
          enum:
          - preview
          - apply
        operations: &organize002
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrganizationOperation'
      required:
      - session_id
      - request_id
      - generation
      - mode
      - operations
    ExecutionOrganizeResult:
      type: object
      additionalProperties: false
      properties:
        mode:
          enum:
          - preview
          - apply
        operations: *organize002
        files:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/File'
      required:
      - mode
      - operations
      - files
      allOf:
      - if:
          properties:
            mode:
              const: preview
        then:
          properties:
            files:
              maxItems: 0
        else:
          properties:
            files:
              minItems: 1
    ExecutionPublish:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)[^\x00]+$
        expected_parent_revision:
          type: integer
          minimum: 0
        source_version_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        strategy:
          type: string
          enum:
          - created
          - regenerated
          - edited_in_place
        validation:
          allOf:
          - $ref: '#/components/schemas/Validation'
          - properties:
              status:
                const: passed
              verifier_exit:
                const: 0
              checks:
                type: array
                minItems: 3
                maxItems: 16
                uniqueItems: true
            required:
            - status
            - verifier_exit
            - checks
      required:
      - session_id
      - request_id
      - turn_id
      - generation
      - path
      - expected_parent_revision
      - source_version_ids
      - strategy
      - validation
    ExecutionPublication:
      type: object
      additionalProperties: false
      properties:
        metadata:
          $ref: '#/components/schemas/ExecutionPublish'
        file:
          type: string
          format: binary
        preview:
          type: string
          format: binary
      required:
      - metadata
      - file
    ExecutionAcquire:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 0
        storage_bytes:
          type: integer
          minimum: 0
      required:
      - session_id
      - request_id
      - expected_revision
      - storage_bytes
    ExecutionTurn:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        operation:
          enum:
          - check
          - renew
          - recover
          - release
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
        terminal_state:
          enum:
          - completed
          - failed
          - cancelled
          - null
        cleanup_confirmed:
          type: boolean
      required:
      - session_id
      - request_id
      - generation
      - operation
      - usage
      - terminal_state
      - cleanup_confirmed
    ExecutionState:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/WorkSession'
        cleanup_required:
          type: boolean
      required:
      - session
      - cleanup_required
    ExecutionForgeResult:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        state:
          enum: [pending, running, succeeded, failed, unknown]
        approval_id:
          type: string
          format: uuid
        approval:
          $ref: '#/components/schemas/Approval'
        commit:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{40}$
          - type: 'null'
      required: [operation_id, state, approval]
    ExecutionForge:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        operation:
          enum: [issue, execute, status]
        operation_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/RepositoryAction'
        snapshot_content:
          type: string
      required: [session_id, request_id, generation, operation]
    ExecutionApprovalIssue:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        approver_member_id:
          type: string
          format: uuid
        action_kind:
          type: string
          enum:
          - delete
          - overwrite
          - locality_promotion
          - external_export
          - external_write
          - repository_import
          - branch
          - commit
          - pull_request
          - local_read
        effects:
          oneOf:
          - type: object
            additionalProperties: false
            properties:
              file_id:
                type: string
                format: uuid
              folder_id:
                type: string
                format: uuid
              path:
                type: string
                minLength: 1
                maxLength: 1024
                pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)[^\x00]+$
              base_version:
                type: string
                format: uuid
              revision:
                type: integer
                minimum: 0
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              size_bytes:
                type: integer
                minimum: 0
            required:
            - file_id
            - folder_id
            - path
            - base_version
            - revision
            - sha256
            - size_bytes
          - type: object
            additionalProperties: false
            properties:
              file_id:
                type: string
                format: uuid
              base_version:
                type: string
                format: uuid
              revision:
                type: integer
                minimum: 0
            required:
            - file_id
            - base_version
            - revision
          - type: object
            additionalProperties: false
            properties:
              memory_ids:
                type: array
                items:
                  type: string
                  format: uuid
                uniqueItems: true
                maxItems: 100
              memory_revision:
                type: integer
                minimum: 0
            required:
            - memory_ids
            - memory_revision
        destination:
          $ref: '#/components/schemas/Endpoint'
        maximum_bytes:
          type: integer
          minimum: 0
      required:
      - session_id
      - request_id
      - generation
      - approver_member_id
      - action_kind
      - effects
      - destination
      - maximum_bytes
    ExecutionApprovalDecision:
      type: object
      additionalProperties: false
      properties:
        approval_id:
          type: string
          format: uuid
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
      required:
      - approval_id
      - decision
    ExecutionEvents:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        progress:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEvent'
          maxItems: 40
        audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
          maxItems: 40
      required:
      - session_id
      - request_id
      - generation
      - progress
      - audit
    ExecutionEventsResult:
      type: object
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEvent'
          maxItems: 80
        last_event_seq:
          type: integer
          minimum: 0
      required:
      - events
      - last_event_seq
    IdentityResolutionRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 320
        org: &id001
          anyOf:
          - &id002
            type: string
            format: uuid
          - type: 'null'
        project: *id001
      required:
      - subject
      - org
      - project
    ScopedIdentity:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 320
        member: *id002
        org: *id002
        project: *id001
        membership_revision:
          type: integer
          minimum: 0
        policy_revision:
          type: integer
          minimum: 0
        expires:
          type: integer
          minimum: 0
        audience:
          const: atlas-retrieval-projects
      required:
      - subject
      - member
      - org
      - project
      - membership_revision
      - policy_revision
      - expires
      - audience
    IdentityResolution:
      type: object
      additionalProperties: false
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        identity:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        expires:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - memberships
      - identity
      - expires
    RetentionPolicy:
      type: object
      additionalProperties: false
      properties:
        content_expiry_days:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          default: null
        deletion_grace_days:
          type: integer
          minimum: 0
          default: 30
        temporary_after_terminal_hours:
          type: integer
          minimum: 0
          default: 24
        audit_days:
          type: integer
          minimum: 1
          default: 90
        backup_expiry_days:
          type: integer
          minimum: 0
          maximum: 30
          default: 30
        superseded_versions_days:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          default: null
        legal_hold:
          type: boolean
          default: false
      required:
      - content_expiry_days
      - deletion_grace_days
      - temporary_after_terminal_hours
      - audit_days
      - backup_expiry_days
      - superseded_versions_days
      - legal_hold
    WorkLimits:
      type: object
      additionalProperties: false
      properties:
        tool_calls:
          type: integer
          minimum: 1
          maximum: 40
        model_calls:
          type: integer
          minimum: 1
          maximum: 41
        wall_seconds:
          type: integer
          minimum: 1
          maximum: 1200
        cost_eur:
          type: number
          minimum: 0
          maximum: 3
        per_call_eur:
          type: number
          minimum: 0
          maximum: 0.1
        expanded_bytes:
          type: integer
          minimum: 1
          maximum: 209715200
        archive_entries:
          type: integer
          minimum: 1
          maximum: 20000
        text_tool_bytes:
          type: integer
          minimum: 1
          maximum: 262144
        command_output_bytes:
          type: integer
          minimum: 1
          maximum: 32768
        command_seconds:
          type: integer
          minimum: 1
          maximum: 120
        command_memory_bytes:
          type: integer
