      description: Project composer sends the new user turn; history is rebuilt server-side. Action omitted means
        chat. Work requires a scoped work_session_id. Multipart legacy attachments are normalized through the scoped
        file ingress before dispatch.
      if:
        properties:
          project_action:
            const: work
        required:
        - project_action
      then:
        required:
        - work_session_id
      else:
        not:
          required:
          - work_session_id
